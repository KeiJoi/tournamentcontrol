services:
  - type: web
    name: tournament-control
    runtime: node
    branch: main
    plan: starter
    numInstances: 1
    # Production runtime, but TypeScript/Vite are needed while compiling the web app.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start --workspace=@tournament-control/server
    healthCheckPath: /health
    disk:
      name: tournament-control-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_PATH
        value: /var/data/vat-tournaments.sqlite
      - key: SERVER_ACCESS_PASSWORD
        sync: false
      - key: MASTER_ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: RETENTION_DAYS
        value: "30"
      - key: SQLITE_BACKUP_COUNT
        value: "7"
